<script>
document.addEventListener("DOMContentLoaded", async () => {
  try {
    // --- Get asl_school_id from the page ---
    const schoolEl = document.querySelector("#school-profile");
    const aslSchoolId = schoolEl?.dataset.aslSchoolId;

    if (!aslSchoolId) {
      console.error("asl_school_id not found on page");
      return;
    }

    // --- Call the API ---
    const response = await fetch(`/api/library/school_profile?asl_school_id=${encodeURIComponent(aslSchoolId)}`);
    const data = await response.json();

    if (!response.ok) {
      console.error("API error:", data.error || data.message || data);
      return;
    }

    // --- Display total active users ---
    const totalEl = document.querySelector("#active-users");
    totalEl.textContent = `${data.total_active_users}`;

    // --- Display per-school breakdown ---
    const breakdownEl = document.querySelector("#school-breakdown");
    breakdownEl.innerHTML = ""; // clear old data

    if (data.schools && data.schools.length > 0) {
      const list = document.createElement("ul");
      data.schools.forEach(school => {
        const li = document.createElement("li");
        li.textContent = `${school.institution_name}: ${school.active_users} active users`;
        list.appendChild(li);
      });
      breakdownEl.appendChild(list);
    } else {
      breakdownEl.textContent = "No schools with activity found.";
    }

  } catch (err) {
    console.error("Error fetching school profile:", err);
  }
});
</script>




 
<script>
// Accordion
function myFunction(id) {
  var x = document.getElementById(id);
  if (x.className.indexOf("w3-show") == -1) {
    x.className += " w3-show";
    x.previousElementSibling.className += " w3-theme-d1";
  } else { 
    x.className = x.className.replace("w3-show", "");
    x.previousElementSibling.className = 
    x.previousElementSibling.className.replace(" w3-theme-d1", "");
  }
}

// Used to toggle the menu on smaller screens when clicking on the menu button
function openNav() {
  var x = document.getElementById("navDemo");
  if (x.className.indexOf("w3-show") == -1) {
    x.className += " w3-show";
  } else { 
    x.className = x.className.replace(" w3-show", "");
  }
}
</script>
