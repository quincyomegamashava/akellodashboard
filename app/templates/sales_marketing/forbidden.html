{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="sm-page px-3 py-5 text-center">
  <div class="sm-card mx-auto" style="max-width: 32rem;">
    <h1 class="h4 mb-2">Access restricted</h1>
    <p class="text-muted mb-3">
      You need the <strong>{{ privilege_name }}</strong> privilege to use this area.
      Ask an administrator to grant it under Administration → user privileges.
    </p>
    <a href="{{ url_for('overview') }}" class="btn btn-primary" style="background:#00407d;">Back to overview</a>
  </div>
</div>
{% endblock %}
