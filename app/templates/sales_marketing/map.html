{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/shared_hub.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/sales_marketing.css') }}">
{% endblock %}
{% block content %}
<div class="sm-page px-3 py-3">
  <h1 class="h4 mb-1">{{ title }}</h1>
  <p class="text-muted small mb-3">Lead density by province — click to filter stakeholders.</p>
  {% include "sales_marketing/_subnav.html" %}
  <div class="sm-card mb-3">
    <div class="sm-filter-row mb-2">
      <select class="form-select form-select-sm" id="sm-map-period" style="max-width:10rem;">
        <option value="all">All time</option>
        <option value="month">This month</option>
        <option value="week">This week</option>
      </select>
    </div>
    <div id="sm-map-host"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>window.SM_PAGE = "map";</script>
<script src="{{ url_for('static', filename='js/sales_marketing.js') }}"></script>
<script src="{{ url_for('static', filename='js/sm_roadmap.js') }}"></script>
{% endblock %}
