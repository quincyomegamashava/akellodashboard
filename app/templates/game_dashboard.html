<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Glassmorphism styles */
    .glass {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
    }
    
    .glass-hover:hover {
      background: rgba(255, 255, 255, 0.85);
      box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.15);
      transform: translateY(-2px);
      transition: all 0.3s ease;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.1);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 0, 0, 0.3);
    }
    
    /* Smooth transitions */
    * {
      transition: all 0.2s ease;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-white via-gray-50 to-white min-h-screen font-sans">
  
  <!-- Sticky Header -->
  <header class="sticky top-0 z-50 w-full glass border-b border-white/20">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl overflow-hidden shadow-lg">
          <img src="{{ url_for('static', filename='smartlearning.webp') }}" alt="Game Portal Logo" class="w-full h-full object-cover">
        </div>
        <h1 class="text-xl font-bold text-gray-800 tracking-tight">Game Portal</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <span id="userNameDisplay" class="text-sm font-medium text-gray-600 hidden sm:block">Welcome, Player!</span>
        <button onclick="logout()" class="group relative inline-flex items-center justify-center rounded-lg glass-card px-4 py-2 text-sm font-semibold text-red-600 hover:bg-red-50/50 transition-all">
          <i class="fas fa-sign-out-alt mr-2 group-hover:translate-x-0.5 transition-transform"></i>
          Logout
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    
    <!-- User Stats Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
      <!-- Games Played -->
      <div class="glass-card rounded-2xl p-6 glass-hover relative overflow-hidden">
        <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-indigo-100/30 rounded-full blur-2xl"></div>
        <div class="relative">
          <div class="text-3xl font-bold text-indigo-600 mb-1" id="totalGamesPlayed">0</div>
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-2">
            <i class="fas fa-gamepad"></i> Games Played
          </div>
        </div>
      </div>

      <!-- Average Score -->
      <div class="glass-card rounded-2xl p-6 glass-hover relative overflow-hidden">
        <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-emerald-100/30 rounded-full blur-2xl"></div>
        <div class="relative">
          <div class="text-3xl font-bold text-emerald-600 mb-1" id="averageScore">0</div>
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-2">
            <i class="fas fa-chart-line"></i> Average Score
          </div>
        </div>
      </div>

      <!-- Best Score -->
      <div class="glass-card rounded-2xl p-6 glass-hover relative overflow-hidden">
        <div class="absolute top-0 right-0 -mt-4 -mr-4 w-24 h-24 bg-amber-100/30 rounded-full blur-2xl"></div>
        <div class="relative">
          <div class="text-3xl font-bold text-amber-600 mb-1" id="bestScore">0</div>
          <div class="text-xs font-semibold text-gray-500 uppercase tracking-wider flex items-center gap-2">
            <i class="fas fa-trophy"></i> Best Score
          </div>
        </div>
      </div>
    </div>

    <!-- Two Column Layout: Games and Leaderboard -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-12">
      
      <!-- Available Games Section (2/3 width) -->
      <div class="lg:col-span-2">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-indigo-100/50 text-indigo-600 rounded-lg glass-card">
            <i class="fas fa-play-circle"></i>
          </div>
          <h2 class="text-2xl font-bold text-gray-800">Available Games</h2>
        </div>
        
        <div id="gamesList" class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Loading State -->
          <div class="col-span-full glass-card rounded-xl border border-white/30 p-12 text-center">
            <i class="fas fa-spinner fa-spin text-3xl text-indigo-500 mb-4"></i>
            <p class="text-gray-500">Loading available games...</p>
          </div>
        </div>
      </div>

      <!-- Leaderboard Section (1/3 width) -->
      <div class="lg:col-span-1">
        <div class="flex items-center gap-3 mb-6">
          <div class="p-2 bg-amber-100/50 text-amber-600 rounded-lg glass-card">
            <i class="fas fa-trophy"></i>
          </div>
          <h2 class="text-2xl font-bold text-gray-800">Leaderboard</h2>
        </div>
        
        <div class="glass-card rounded-2xl overflow-hidden">
          <div id="leaderboard" class="p-6">
            <div class="text-center text-gray-400 py-8">
              <i class="fas fa-spinner fa-spin text-2xl mb-4"></i>
              <p class="text-sm">Loading leaderboard...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- User Scores Section -->
    <div class="glass-card rounded-2xl overflow-hidden">
      <div class="px-6 py-5 border-b border-white/20 flex items-center gap-3 bg-white/30">
        <div class="p-2 bg-amber-100/50 text-amber-600 rounded-lg">
          <i class="fas fa-history"></i>
        </div>
        <h2 class="text-lg font-bold text-gray-800">Your Performance History</h2>
      </div>
      
      <div id="myScores" class="overflow-x-auto">
        <div class="p-12 text-center text-gray-400">
          <i class="fas fa-spinner fa-spin text-3xl mb-4"></i>
          <p>Loading your scores...</p>
        </div>
      </div>
    </div>

  </main>

  <footer class="mt-12 py-8 text-center text-sm text-gray-400">
    <p>&copy; <span id="year"></span> Akello Game Portal. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const gameUserId = sessionStorage.getItem('gameUserId');
    const gameUserName = sessionStorage.getItem('gameUserName');

    if (!gameUserId) {
      window.location.href = '/game-login';
    }

    document.getElementById('userNameDisplay').textContent = `Welcome, ${gameUserName || 'Player'}!`;

    document.addEventListener('DOMContentLoaded', () => {
      loadGames();
      loadUserStats();
      loadMyScores();
      loadLeaderboard();
    });

    let userScores = [];
    let userStats = null;

    // Helper functions for difficulty level display
    function getDifficultyBadgeClass(level) {
      const classes = {
        'easy': 'bg-green-100/80 text-green-700',
        'medium': 'bg-yellow-100/80 text-yellow-700',
        'hard': 'bg-red-100/80 text-red-700'
      };
      return classes[level] || 'bg-gray-100/80 text-gray-600';
    }

    function getDifficultyIcon(level) {
      const icons = {
        'easy': 'fa-seedling',
        'medium': 'fa-fire',
        'hard': 'fa-mountain'
      };
      return icons[level] || 'fa-circle';
    }

    function getDifficultyLabel(level) {
      const labels = {
        'easy': 'Easy',
        'medium': 'Medium',
        'hard': 'Hard'
      };
      return labels[level] || level;
    }

    async function loadGames() {
      try {
        // Load user scores first to check which games they've played
        const scoresRes = await fetch(`/api/game-users/${gameUserId}/scores`);
        if (scoresRes.ok) {
          const scoresData = await scoresRes.json();
          userScores = scoresData.scores || [];
        }
        
        // Pass user_id to filter games by user's age
        const r = await fetch(`/api/games?active=true&user_id=${gameUserId}`);
        const data = await r.json();
        const container = document.getElementById('gamesList');
        
        if (!data.games || data.games.length === 0) {
          container.innerHTML = `
            <div class="col-span-full glass-card rounded-xl p-12 text-center border border-white/30">
              <div class="w-16 h-16 bg-gray-100/50 rounded-full flex items-center justify-center mx-auto mb-4 text-gray-400">
                <i class="fas fa-gamepad text-2xl"></i>
              </div>
              <h3 class="text-lg font-medium text-gray-800">No Games Available</h3>
              <p class="text-gray-500 mt-2">There are no active games for your age group at the moment.</p>
            </div>`;
          return;
        }
        
        // Create a map of game_id to check if user has played
        const playedGames = new Set(userScores.map(s => s.game_id));
        
        container.innerHTML = data.games.map(g => {
          const hasPlayed = playedGames.has(g.id);
          const difficultyBadge = g.difficulty_level ? 
            `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${getDifficultyBadgeClass(g.difficulty_level)} whitespace-nowrap"><i class="fas ${getDifficultyIcon(g.difficulty_level)} mr-1.5"></i> ${getDifficultyLabel(g.difficulty_level)}</span>` : '';
          return `
          <div class="group glass-card rounded-xl glass-hover flex flex-col h-full relative overflow-hidden ${hasPlayed ? 'opacity-90' : ''}">
            <!-- Decorative top border -->
            <div class="h-1 w-full bg-gradient-to-r ${hasPlayed ? 'from-amber-400 to-amber-500' : 'from-indigo-500 to-purple-600'}"></div>
            
            <div class="p-6 flex-grow flex flex-col">
              <div class="flex justify-between items-start mb-4">
                <h3 class="text-lg font-bold text-gray-800 line-clamp-1 group-hover:text-indigo-600 transition-colors">${escapeHtml(g.title)}</h3>
                <div class="flex items-center gap-2 flex-wrap justify-end">
                  ${g.age_range ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100/80 text-gray-600 whitespace-nowrap"><i class="fas fa-users mr-1.5"></i> Ages ${g.age_range}</span>` : ''}
                  ${difficultyBadge}
                </div>
              </div>
              
              <p class="text-gray-600 text-sm mb-6 line-clamp-3 flex-grow">${escapeHtml(g.description || 'Test your skills with this exciting educational game!')}</p>
              
              <div class="mt-auto">
                ${hasPlayed ? `
                  <div class="rounded-lg bg-amber-50/80 border border-amber-200/50 p-4 text-center">
                    <div class="flex items-center justify-center text-amber-600 mb-1">
                      <i class="fas fa-check-circle mr-2"></i>
                      <span class="font-semibold">Completed</span>
                    </div>
                    <p class="text-xs text-amber-700">You cannot replay this game.</p>
                  </div>
                ` : `
                  <button onclick="playGame(${g.id})" class="w-full inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 hover:shadow-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all duration-200 transform active:scale-[0.98]">
                    <i class="fas fa-play mr-2"></i> Play Now
                  </button>
                `}
              </div>
            </div>
          </div>
        `;
        }).join('');
      } catch (e) {
        console.error(e);
        document.getElementById('gamesList').innerHTML = `
          <div class="col-span-full glass-card rounded-xl p-8 text-center border border-red-200/50 text-red-600 bg-red-50/50">
            <i class="fas fa-exclamation-triangle text-2xl mb-2"></i>
            <p>Error loading games. Please try refreshing the page.</p>
          </div>`;
      }
    }

    function playGame(gameId) {
      window.location.href = `/play-game/${gameId}`;
    }
    window.playGame = playGame;

    async function loadUserStats() {
      try {
        const r = await fetch(`/api/game-users/${gameUserId}/stats`);
        const data = await r.json();
        if (r.ok && data.stats) {
          userStats = data.stats;
          // Animate numbers slightly
          animateValue(document.getElementById('totalGamesPlayed'), 0, data.stats.total_games || 0, 1000);
          document.getElementById('averageScore').textContent = data.stats.average_score ? data.stats.average_score.toFixed(1) : '0';
          animateValue(document.getElementById('bestScore'), 0, data.stats.best_score || 0, 1000);
        }
      } catch (e) {
        console.error(e);
      }
    }
    
    function animateValue(obj, start, end, duration) {
      if (start === end) return;
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        obj.innerHTML = Math.floor(progress * (end - start) + start);
        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          obj.innerHTML = end;
        }
      };
      window.requestAnimationFrame(step);
    }

    async function loadLeaderboard() {
      try {
        const r = await fetch(`/api/game-users/${gameUserId}/leaderboard`);
        if (!r.ok) {
          throw new Error('Failed to load leaderboard');
        }
        const data = await r.json();
        const container = document.getElementById('leaderboard');
        
        if (!data.leaderboard || data.leaderboard.length === 0) {
          container.innerHTML = `
            <div class="text-center text-gray-400 py-8">
              <div class="w-16 h-16 bg-gray-100/50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-trophy text-2xl text-gray-300"></i>
              </div>
              <p class="text-sm">No leaderboard data available for your age group (${data.age_range || 'N/A'}).</p>
            </div>`;
          return;
        }
        
        const currentUserRank = data.leaderboard.findIndex(u => u.user_id == gameUserId) + 1;
        const topThree = data.leaderboard.slice(0, 3);
        const rest = data.leaderboard.slice(3, 10); // Show top 10
        
        let html = `
          <div class="mb-4">
            <p class="text-xs text-gray-500 mb-2">Age Group: <span class="font-semibold text-gray-700">${data.age_range}</span></p>
            ${currentUserRank > 0 ? `<p class="text-xs text-gray-500">Your Rank: <span class="font-semibold text-indigo-600">#${currentUserRank}</span></p>` : ''}
          </div>
        `;
        
        // Top 3 with special styling
        if (topThree.length > 0) {
          const medals = ['🥇', '🥈', '🥉'];
          html += '<div class="space-y-3 mb-4">';
          topThree.forEach((user, index) => {
            const isCurrentUser = user.user_id == gameUserId;
            html += `
              <div class="glass-card rounded-lg p-3 ${isCurrentUser ? 'ring-2 ring-indigo-500 bg-indigo-50/50' : ''}">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 flex-1 min-w-0">
                    <span class="text-lg">${medals[index]}</span>
                    <div class="flex-1 min-w-0">
                      <div class="text-sm font-semibold text-gray-800 truncate">${escapeHtml(user.firstname)} ${escapeHtml(user.surname)}</div>
                      <div class="text-xs text-gray-500 truncate">@${escapeHtml(user.username)}</div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-sm font-bold text-indigo-600">${user.best_score}</div>
                    <div class="text-xs text-gray-500">${user.total_games} games</div>
                  </div>
                </div>
              </div>
            `;
          });
          html += '</div>';
        }
        
        // Rest of the leaderboard
        if (rest.length > 0) {
          html += '<div class="space-y-2">';
          rest.forEach((user, index) => {
            const rank = index + 4;
            const isCurrentUser = user.user_id == gameUserId;
            html += `
              <div class="glass-card rounded-lg p-2.5 ${isCurrentUser ? 'ring-2 ring-indigo-500 bg-indigo-50/50' : ''}">
                <div class="flex items-center justify-between">
                  <div class="flex items-center gap-2 flex-1 min-w-0">
                    <span class="text-xs font-medium text-gray-500 w-6">#${rank}</span>
                    <div class="flex-1 min-w-0">
                      <div class="text-xs font-semibold text-gray-800 truncate">${escapeHtml(user.firstname)} ${escapeHtml(user.surname)}</div>
                    </div>
                  </div>
                  <div class="text-right">
                    <div class="text-xs font-bold text-indigo-600">${user.best_score}</div>
                  </div>
                </div>
              </div>
            `;
          });
          html += '</div>';
        }
        
        container.innerHTML = html;
      } catch (e) {
        console.error('Error loading leaderboard:', e);
        document.getElementById('leaderboard').innerHTML = `
          <div class="text-center text-red-500 py-8">
            <i class="fas fa-exclamation-triangle mb-2"></i>
            <p class="text-sm">Error loading leaderboard. Please try again.</p>
          </div>`;
      }
    }

    async function loadMyScores() {
      try {
        const r = await fetch(`/api/game-users/${gameUserId}/scores`);
        if (!r.ok) {
          throw new Error('Failed to load scores');
        }
        const data = await r.json();
        const container = document.getElementById('myScores');
        
        if (!data.scores || data.scores.length === 0) {
          container.innerHTML = `
            <div class="p-12 text-center text-gray-400">
              <div class="w-16 h-16 bg-gray-100/50 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-trophy text-2xl text-gray-300"></i>
              </div>
              <p>You haven't played any games yet. Start playing to track your progress!</p>
            </div>`;
          return;
        }
        
        container.innerHTML = `
          <table class="min-w-full divide-y divide-white/20">
            <thead class="bg-white/30">
              <tr>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Game Title</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Score</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Accuracy</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Attempt</th>
                <th class="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Date Played</th>
              </tr>
            </thead>
            <tbody class="bg-white/20 divide-y divide-white/20">
              ${data.scores.map(s => `
                <tr class="hover:bg-white/30 transition-colors">
                  <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-bold text-gray-800">${escapeHtml(s.game_title || 'Unknown')}</div>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-md text-sm font-medium bg-indigo-50/80 text-indigo-700 border border-indigo-100/50">
                      ${s.score} <span class="text-indigo-400 ml-1 text-xs font-normal">/ ${s.max_score || '?'}</span>
                    </span>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap">
                    ${s.percentage ? `
                      <div class="flex items-center">
                        <span class="text-sm font-medium ${s.percentage >= 80 ? 'text-green-600' : s.percentage >= 50 ? 'text-amber-600' : 'text-red-600'}">${s.percentage.toFixed(1)}%</span>
                        <div class="w-16 h-1.5 bg-gray-100/50 rounded-full ml-2 overflow-hidden">
                          <div class="h-full rounded-full ${s.percentage >= 80 ? 'bg-green-500' : s.percentage >= 50 ? 'bg-amber-500' : 'bg-red-500'}" style="width: ${s.percentage}%"></div>
                        </div>
                      </div>
                    ` : '<span class="text-gray-400 text-sm">N/A</span>'}
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                    <span class="font-mono text-xs bg-gray-100/50 px-2 py-1 rounded">#${s.attempt_number}</span>
                  </td>
                  <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">
                    ${formatDate(s.played_at)}
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>`;
      } catch (e) {
        console.error('Error loading scores:', e);
        document.getElementById('myScores').innerHTML = `
          <div class="p-8 text-center text-red-500">
            <i class="fas fa-exclamation-triangle mb-2"></i>
            <p>Error loading scores. Please try again.</p>
          </div>`;
      }
    }

    function logout() {
      sessionStorage.clear();
      window.location.href = '/game-login';
    }
    window.logout = logout;

    function formatDate(d) {
      if (!d) return 'N/A';
      const date = new Date(d);
      return date.toLocaleDateString('en-US', { 
        month: 'short', 
        day: 'numeric', 
        year: 'numeric'
      }) + ' at ' + date.toLocaleTimeString('en-US', {
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"]+/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c] || c));
    }
  </script>
</body>
</html>
