<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Portal - Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      top: -250px;
      right: -250px;
      animation: float 20s infinite ease-in-out;
    }
    
    body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      bottom: -200px;
      left: -200px;
      animation: float 15s infinite ease-in-out reverse;
    }
    
    @keyframes float {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(30px, 30px) rotate(180deg); }
    }
    
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }
    
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideUp 0.6s ease-out;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .logo-section {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .logo-icon {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    .logo-icon i {
      font-size: 40px;
      color: white;
    }
    
    .logo-section h1 {
      font-size: 32px;
      font-weight: 700;
      color: #1a202c;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .logo-section p {
      color: #718096;
      font-size: 15px;
      font-weight: 400;
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 8px;
    }
    
    .form-group input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.3s ease;
      background: #f7fafc;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
      background: white;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }
    
    .form-group input::placeholder {
      color: #a0aec0;
    }
    
    .error-message {
      background: #fed7d7;
      color: #c53030;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      margin-bottom: 20px;
      display: none;
      border-left: 4px solid #c53030;
      animation: shake 0.5s;
    }
    
    .error-message.show {
      display: block;
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
    }
    
    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
    }
    
    .login-btn:active:not(:disabled) {
      transform: translateY(0);
    }
    
    .login-btn:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    
    .login-btn i {
      font-size: 18px;
    }
    
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo-section">
        <div class="logo-icon">
          <i class="fas fa-gamepad"></i>
        </div>
        <h1>Game Portal</h1>
        <p>Welcome back! Please login to continue</p>
      </div>
      
      <form id="gameLoginForm">
        <div class="form-group">
          <label for="loginUsername">
            <i class="fas fa-user"></i> Username
          </label>
          <input 
            type="text" 
            id="loginUsername" 
            placeholder="Enter your username" 
            required
            autocomplete="username"
          >
        </div>
        
        <div class="form-group">
          <label for="loginPassword">
            <i class="fas fa-lock"></i> Password
          </label>
          <input 
            type="password" 
            id="loginPassword" 
            placeholder="Enter your password" 
            required
            autocomplete="current-password"
          >
        </div>
        
        <div id="loginError" class="error-message">
          <i class="fas fa-exclamation-circle"></i> <span id="loginErrorMsg"></span>
        </div>
        
        <button type="submit" class="login-btn" id="loginBtn">
          <i class="fas fa-sign-in-alt"></i>
          <span>Login</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('gameLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const errorDiv = document.getElementById('loginError');
      const errorMsg = document.getElementById('loginErrorMsg');
      const btn = document.getElementById('loginBtn');
      const btnSpan = btn.querySelector('span');

      errorDiv.classList.remove('show');
      btn.disabled = true;
      btnSpan.innerHTML = '<span class="spinner"></span> Logging in...';

      try {
        const r = await fetch('/api/game-users/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Login failed');
        
        // Store user session
        sessionStorage.setItem('gameUserId', data.user.id);
        sessionStorage.setItem('gameUsername', data.user.username);
        sessionStorage.setItem('gameUserName', `${data.user.firstname} ${data.user.surname}`);
        
        // Success animation
        btn.style.background = 'linear-gradient(135deg, #48bb78 0%, #38a169 100%)';
        btnSpan.innerHTML = '<i class="fas fa-check"></i> Success!';
        
        // Redirect to dashboard
        setTimeout(() => {
          window.location.href = '/game-dashboard';
        }, 500);
      } catch (err) {
        errorMsg.textContent = err.message || 'Invalid username or password';
        errorDiv.classList.add('show');
        btn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
      } finally {
        btn.disabled = false;
        if (!errorDiv.classList.contains('show')) {
          btnSpan.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
      }
    });
  </script>
</body>
</html>
