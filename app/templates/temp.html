<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Portal - HTML & CSS</title>
    <style>
        :root {
            /* Define colors for easy reuse */
            --color-blue: #4A5BEA;
            --color-red: #E44D5F;
            --color-yellow: #F7B731;
            --color-green: #20C997;
            --color-grey: #868E96;
            --color-light-blue: #5DADE2;

            /* Chart dimensions */
            --chart-size: 500px;
            --hole-size: 300px;
            --icon-distance: 195px; /* Distance of icon from center */
        }

        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        /* 1. Main container */
        .portal-container {
            position: relative;
            width: var(--chart-size);
            height: var(--chart-size);
        }

        /* 2. The colored ring created with a conic gradient */
        .chart-ring {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                from 90deg,
                var(--color-red) 0deg 60deg,
                var(--color-blue) 60deg 120deg,
                var(--color-light-blue) 120deg 180deg,
                var(--color-grey) 180deg 240deg,
                var(--color-green) 240deg 300deg,
                var(--color-yellow) 300deg 360deg
            );
            /* This is a subtle trick to somewhat mimic the swirl effect */
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        /* 3. The white circle in the middle that creates the donut "hole" */
        .center-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: var(--hole-size);
            height: var(--hole-size);
            background: white;
            border-radius: 50%;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            box-sizing: border-box; /* Ensures padding doesn't increase size */
        }

        /* 4. Positioning containers for each icon */
        .icon-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        .icon-container svg {
            width: 40px;
            height: 40px;
            fill: white;
            /* Move the icon out from the center */
            transform: translateY(var(--icon-distance));
        }

        /* 5. Rotate each container to its correct position */
        .icon-container:nth-child(1) { transform: rotate(30deg);  } /* Medal */
        .icon-container:nth-child(2) { transform: rotate(90deg);  } /* Cap */
        .icon-container:nth-child(3) { transform: rotate(150deg); } /* Atom */
        .icon-container:nth-child(4) { transform: rotate(210deg); } /* Search */
        .icon-container:nth-child(5) { transform: rotate(270deg); } /* Lamp */
        .icon-container:nth-child(6) { transform: rotate(330deg); } /* Compass */
        

        /* 6. Typography for the center text */
        .center-content h2 {
            font-size: 2.2rem;
            margin: 0 0 10px 0;
            color: #343a40;
        }

        .center-content ul {
            list-style: none;
            padding: 0;
            margin: 0;
            color: #495057;
        }

        .center-content li {
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .center-content li::before {
            content: '•';
            color: #6c757d;
            display: inline-block;
            width: 1em;
            margin-left: -1em;
        }

    </style>
</head>
<body>
