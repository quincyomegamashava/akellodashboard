{% extends "base.html" %}
{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/learn_admin_hub.css') }}" />
{% endblock %}
{% block content %}
<div class="lha-shell">
  <nav class="lha-nav-strip mb-4">
    <div class="container-fluid px-lg-4 d-flex flex-wrap align-items-center gap-3 justify-content-between">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <span class="lha-brand"><i class="fas fa-layer-group me-2"></i>Learn Hub Admin</span>
        <a class="lha-nav-link{% if request.endpoint == 'learn_admin.dashboard' %} active{% endif %}" href="{{ url_for('learn_admin.dashboard') }}">Overview</a>
        <a class="lha-nav-link{% if request.endpoint == 'learn_admin.learners_list' or request.endpoint == 'learn_admin.learner_detail' %} active{% endif %}" href="{{ url_for('learn_admin.learners_list') }}">Learners</a>
        <a class="lha-nav-link{% if request.endpoint == 'learn_admin.challenges_index' or request.endpoint == 'learn_admin.challenge_inspect' %} active{% endif %}" href="{{ url_for('learn_admin.challenges_index') }}">Challenges</a>
        <a class="lha-nav-link{% if request.endpoint == 'learn_admin.challenge_new' %} active{% endif %}" href="{{ url_for('learn_admin.challenge_new') }}">New challenge</a>
      </div>
      <div class="d-flex flex-wrap gap-2 align-items-center">
        <a class="btn btn-sm lha-btn-outline" href="{{ url_for('learn_portal.index') }}" target="_blank" rel="noopener">Open learner site</a>
      </div>
    </div>
  </nav>
  <div class="container-fluid px-lg-4 pb-5">
    {% block lha_body %}{% endblock %}
  </div>
</div>
{% endblock %}
