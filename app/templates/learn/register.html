{% extends "learn/base.html" %}
{% block title %}Register · Akello Learn{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm lh-card">
      <div class="card-body p-4">
        <h2 class="h4 mb-4">Create your learner profile</h2>
        <form method="post">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input name="username" class="form-control" required minlength="2" />
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input name="email" type="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label class="form-label">Password (min 8 characters)</label>
            <input name="password" type="password" class="form-control" required minlength="8" />
          </div>
          <div class="mb-3">
            <label class="form-label">Full name</label>
            <input name="full_name" class="form-control" />
          </div>
          <div class="row g-2">
            <div class="col-md-4">
              <label class="form-label">School level</label>
              <select name="category" class="form-select">
                <option value="primary">Primary</option>
                <option value="secondary" selected>Secondary</option>
                <option value="tertiary">Tertiary</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Age band</label>
              <select name="age_band" class="form-select">
                <option value="6-8">6–8</option>
                <option value="9-12">9–12</option>
                <option value="13-15" selected>13–15</option>
                <option value="16-18">16–18</option>
                <option value="18+">18+</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Skill level</label>
              <select name="skill_level" class="form-select">
                <option value="beginner" selected>Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
              </select>
            </div>
          </div>
          <p class="small text-muted mt-2 mb-0">Skill level updates automatically from quiz and coding performance after you start learning.</p>
          <button class="btn lh-btn-primary w-100 mt-4" type="submit">Create account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
