<body data-school-id="{{ school_id }}" data-school-name="{{ school_name }}">
<style>
  /* Modern, responsive layout */
  .profile-wrapper { max-width: 1200px; margin: 60px auto 40px; padding: 0 16px; }
  .profile-grid { display: grid; grid-template-columns: 320px 1fr 320px; gap: 20px; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 6px 18px rgba(10, 31, 68, 0.08); overflow: hidden; }
  .card-header { padding: 16px 18px; border-bottom: 1px solid #eef2f7; background: linear-gradient(180deg, #f7faff 0%, #ffffff 100%); }
  .card-body { padding: 18px; }
  .soft { color: #6b7a90; }
  .pill { display: inline-flex; align-items: center; gap: 8px; background: #edf4ff; color: #0b5ed7; border-radius: 999px; padding: 6px 12px; font-size: .85rem; font-weight: 600; }
  .stat { display: grid; grid-template-columns: 56px 1fr; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; background: #f9fbff; border: 1px solid #eef2f7; }
  .stat .icon { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; color: #fff; }
  .stat .value { font: 700 1.35rem/1.1 system-ui, -apple-system, Segoe UI, Roboto; color: #0b213f; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; background: #e9f7f7; color: #116a6a; border-radius: 999px; border: 1px solid #cdeaea; text-decoration: none; font-size: .85rem; transition: all .15s; }
  .chip:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(0,0,0,.05); }
  .profile-avatar { width: 110px; height: 110px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; }
  .kv .k { font: 600 .75rem/1 system-ui; text-transform: uppercase; letter-spacing: .04em; color: #77849a; }
  .kv .v { font: 600 1rem/1.4 system-ui; color: #0f2547; background: #f9fbff; border: 1px solid #eef2f7; border-radius: 10px; padding: 8px 12px; }

  /* Modern table styling */
  #student-table { border-collapse: separate; border-spacing: 0; background: #fff; overflow: hidden; }
  #student-table thead th, #student-table thead td { position: sticky; top: 0; z-index: 2; background: linear-gradient(180deg,#f7faff,#ffffff); font-weight: 600; text-transform: uppercase; font-size: 0.8rem; letter-spacing: .02em; border-bottom: 1px solid #e6ebf2; }
  #student-table tbody tr:hover { background: #f9fbff; }
  #student-table td, #student-table th { padding: 10px 12px !important; vertical-align: middle; }
  #student-table tbody td { border-top: 1px solid #f0f3f8; }

  .table-shell { border-radius: 14px; box-shadow: 0 6px 18px rgba(13, 38, 76, 0.06); background: #fff; }
  .search-shell { max-width: 520px; margin: 6px auto 0; }
  .search-shell .input-group-text { background: #f7f9fc; border-color: #e6ebf2; }
  .search-shell input { border-color: #e6ebf2; }

  .no-matches { text-align: center; color: #6b7a90; font-size: 0.9rem; }

  @media (max-width: 1100px) { .profile-grid { grid-template-columns: 3200px 1fr; } .profile-right { order: 3; grid-column: 1 / -1; } }
  @media (max-width: 780px) { .profile-grid { grid-template-columns: 1fr; } .profile-left, .profile-main, .profile-right { grid-column: 1 / -1; } .kv { grid-template-columns: 1fr; } .profile-avatar { width: 84px; height: 84px; } .profile-wrapper { max-width: 85vw; } }
</style>

            <div class="w3-container w3-indigo w3-text-white w3-round-top w3-padding-small"><b>Ask Akello</b></div>
<div class="w3-container w3-padding-small"><div class="value" id="mon-ask">—</div><div id="grade-counts" class="w3-text-gray w3-tiny">Ask metric</div></div>

              <div class="value" id="chatlog-count">0</div>
            </div>

          <script>
            async function loadChatlogData(startDate = null, endDate = null) {
              // Grab school ID from the body tag
              const schoolEl = document.querySelector("#school-profile");
              const schoolId = schoolEl?.dataset.aslSchoolId;

              if (!schoolId) {
                document.getElementById('chatlog-count').innerText = "No school ID found.";
                return;
              }

              try {
                let url = `/api/ask-akello-chosen-school/${schoolId}`;
                if (startDate && endDate) {
                  url += `?start_date=${startDate}&end_date=${endDate}`;
                }
                const res = await fetch(url);
                const data = await res.json();

                if (res.ok) {
                  document.getElementById('chatlog-count').innerText =
                    `${data.chatlog_count}`;
                } else {
                  document.getElementById('chatlog-count').innerText =
                    `Error: ${data.error || 'Failed to load data.'}`;
                }
              } catch (err) {
                document.getElementById('chatlog-count').innerText =
                  `Error fetching data: ${err.message}`;
              }
            }
          </script>

<script>
// Debounce utility
function debounce(fn, wait){
  let t; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args), wait); };
}

// Client-side table filter by text across all cells
function filterUsersImmediate(){
  const input = document.getElementById('userSearchInput');
  const term = (input?.value || '').trim().toLowerCase();
  const tbody = document.getElementById('student-table-body');
  if (!tbody) return;
  const rows = Array.from(tbody.querySelectorAll('tr'));
  let matchCount = 0;

  rows.forEach(row => {
    if (row.id === 'noMatchesRow') return; // skip special row
    const text = row.textContent.trim().toLowerCase();
    const match = term === '' ? true : text.includes(term);
    row.style.display = match ? '' : 'none';
    if (match) matchCount++;
  });

  const noRow = document.getElementById('noMatchesRow');
  if (noRow){
    noRow.style.display = matchCount === 0 ? '' : 'none';
  }
}

const filterUsers = debounce(filterUsersImmediate, 200);

// Wire up input listener
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('userSearchInput');
  if (input){
    input.addEventListener('input', filterUsers);
  }
});
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>





<script>
async function loadLibraryProfile(startDate = null, endDate = null) {
  try {
    // --- Get asl_school_id from the page ---
    const schoolEl = document.querySelector("#school-profile");
    const aslSchoolId = schoolEl?.dataset.aslSchoolId;

    if (!aslSchoolId) {
      console.error("asl_school_id not found on page");
      return;
    }

    // --- Call the API with optional date range ---
    let url = `/api/library/school_profile?asl_school_id=${encodeURIComponent(aslSchoolId)}`;
    if (startDate && endDate) {
      url += `&start_date=${startDate}&end_date=${endDate}`;
    }
    const response = await fetch(url);
    const data = await response.json();

    if (!response.ok) {
      console.error("API error:", data.error || data.message || data);
      return;
    }

    // --- Display total active users ---
    const totalEl = document.querySelector("#active-users");
    totalEl.textContent = `${data.total_active_users}`;

    // --- Display per-school breakdown ---
    const breakdownEl = document.querySelector("#school-breakdown");
    if (breakdownEl) {
      breakdownEl.innerHTML = ""; // clear old data

      if (data.schools && data.schools.length > 0) {
        const list = document.createElement("ul");
        data.schools.forEach(school => {
          const li = document.createElement("li");
          li.textContent = `${school.institution_name}: ${school.active_users} active users`;
          list.appendChild(li);
        });
        breakdownEl.appendChild(list);
      } else {
        breakdownEl.textContent = "No schools with activity found.";
      }
    }

  } catch (err) {
    console.error("Error fetching school profile:", err);
  }
}
</script>

<script>
// Date filter coordination script
(function() {
  // Helper to get default MTD dates
  function getDefaultDates() {
    const today = new Date();
    const startOfMonth = new Date(today.getFullYear(), today.getMonth(), 1);
    return {
      startDate: startOfMonth.toISOString().split('T')[0],
      endDate: today.toISOString().split('T')[0]
    };
  }

  // Function to load all data with date range
  async function loadAllData(startDate = null, endDate = null) {
    // Load Ask Akello data
    if (typeof loadChatlogData === 'function') {
      await loadChatlogData(startDate, endDate);
    }

    // Load Library profile data
    if (typeof loadLibraryProfile === 'function') {
      await loadLibraryProfile(startDate, endDate);
    }

    // Load Smartlearning data
    if (typeof window.loadSmartlearningData === 'function') {
      await window.loadSmartlearningData(startDate, endDate);
    }
  }

  // Initialize on page load
  document.addEventListener('DOMContentLoaded', function() {
    const startInput = document.getElementById('start-date');
    const endInput = document.getElementById('end-date');
    const filterForm = document.getElementById('date-filter-form');
    const resetBtn = document.getElementById('reset-filter');

    // Set default MTD dates
    const { startDate, endDate } = getDefaultDates();
    if (startInput && endInput) {
      startInput.value = startDate;
      endInput.value = endDate;
    }

    // Load initial data
    loadAllData();

    // Handle form submission
    if (filterForm) {
      filterForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const start = startInput.value;
        const end = endInput.value;
        if (start && end) {
          loadAllData(start, end);
        }
      });
    }

    // Handle reset button
    if (resetBtn) {
      resetBtn.addEventListener('click', function() {
        const { startDate, endDate } = getDefaultDates();
        startInput.value = startDate;
        endInput.value = endDate;
        loadAllData();
      });
    }
  });
})();
</script>
