{% extends "base.html" %}

{% block content %}

<style>
  .contract-wrapper {
    max-width: 1400px;
    margin: 40px auto;
    padding: 0 24px;
  }

  .glass-card {
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.12);
    border-radius: 20px;
    overflow: hidden;
  }

  .card-header {
    padding: 24px 28px;
    border-bottom: 1px solid rgba(226, 232, 240, 0.5);
    font-weight: 700;
    font-size: 1.5rem;
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.08) 0%, rgba(255, 255, 255, 0.9) 100%);
    color: #1e293b;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .card-header i {
    color: #6366f1;
    font-size: 1.75rem;
  }

  .card-body {
    padding: 28px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    padding: 16px 20px;
    background: rgba(248, 250, 252, 0.6);
    border-radius: 12px;
    border: 1px solid rgba(226, 232, 240, 0.5);
  }

  .toolbar-left {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar-right {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .btn-modern {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  }

  .btn-primary-modern {
    background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    color: white;
  }

  .btn-primary-modern:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
  }

  .btn-success-modern {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: white;
  }

  .btn-success-modern:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
  }

  .btn-danger-modern {
    background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    color: white;
  }

  .btn-danger-modern:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
  }

  .btn-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 10px;
    border: 1px solid rgba(226, 232, 240, 0.8);
    background: rgba(255, 255, 255, 0.9);
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .btn-chip:hover {
    background: #6366f1;
    color: #fff;
    border-color: #6366f1;
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
  }

  .table-container {
    max-height: 65vh;
    overflow: auto;
    border-radius: 12px;
    border: 1px solid rgba(226, 232, 240, 0.5);
    background: rgba(255, 255, 255, 0.5);
  }

  table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }

  thead th {
    background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
    position: sticky;
    top: 0;
    z-index: 10;
    padding: 14px 12px;
    font-weight: 600;
    color: #1e293b;
    font-size: 0.875rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid rgba(99, 102, 241, 0.2);
  }

  tbody tr {
    transition: all 0.2s ease;
    border-bottom: 1px solid rgba(226, 232, 240, 0.5);
  }

  tbody tr:hover {
    background: rgba(99, 102, 241, 0.05);
  }

  tbody tr:last-child {
    border-bottom: none;
  }

  th,
  td {
    padding: 14px 12px;
    vertical-align: middle;
  }

  input[type="text"],
  select {
    width: 100%;
    border: 1px solid rgba(226, 232, 240, 0.8);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.9rem;
    transition: all 0.2s ease;
    background: rgba(255, 255, 255, 0.9);
  }

  input[type="text"]:focus,
  select:focus {
    outline: none;
    border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    background: white;
  }

  #totalWeight {
    font-weight: 700;
    color: #1e293b;
    font-size: 1rem;
    padding: 8px 16px;
    background: rgba(99, 102, 241, 0.1);
    border-radius: 8px;
    border: 1px solid rgba(99, 102, 241, 0.2);
  }

  .error {
    color: #ef4444;
    padding: 12px;
    background: rgba(239, 68, 68, 0.1);
    border-radius: 8px;
    margin-top: 16px;
    border: 1px solid rgba(239, 68, 68, 0.2);
  }

  /* Custom scrollbar */
  .table-container::-webkit-scrollbar {
    width: 8px;
    height: 8px;
  }

  .table-container::-webkit-scrollbar-track {
    background: rgba(241, 245, 249, 0.5);
    border-radius: 4px;
  }

  .table-container::-webkit-scrollbar-thumb {
    background: rgba(148, 163, 184, 0.5);
    border-radius: 4px;
  }

  .table-container::-webkit-scrollbar-thumb:hover {
    background: rgba(148, 163, 184, 0.8);
  }

  @media (max-width: 780px) {
    .contract-wrapper {
      max-width: 95vw;
      padding: 0 16px;
    }

    .card-body {
      padding: 16px;
    }

    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }

    .toolbar-left,
    .toolbar-right {
      width: 100%;
      justify-content: center;
    }

    .table-container {
      overflow: auto;
      border-radius: 8px;
    }

    .table-container table thead {
      display: none;
    }

    .table-container table tbody tr {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      padding: 16px;
      border-bottom: 2px solid rgba(226, 232, 240, 0.5);
      border-radius: 8px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.7);
    }

    .table-container table tbody td {
      display: grid;
      grid-template-columns: 140px 1fr;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
    }

    .table-container table tbody td::before {
      content: attr(data-label);
      font-weight: 600;
      color: #475569;
      font-size: 0.85rem;
    }

    .table-container table tbody td:last-child {
      grid-template-columns: 1fr;
      justify-items: center;
    }
  }
</style>

<div class="contract-wrapper">
  <div class="glass-card">
    <div class="card-header">
      <i class="fas fa-clipboard-list"></i>
      <span>Scorecard Management</span>
    </div>
    <div class="card-body">
      <div class="toolbar">
        <div class="toolbar-left">
          <button type="button" id="addRow" class="btn-chip">
            <i class="fas fa-plus-circle"></i> Add Row
          </button>
          <span id="totalWeight" class="badge">Total Weight: 0</span>
          <span id="weightWarning" class="small text-danger ml-2" style="display:none;">Weight should total 100</span>
        </div>
        <div class="toolbar-right">
          <button type="button" id="exportExcel" class="btn-success-modern btn-modern">
            <i class="fas fa-file-excel"></i> Export Excel
          </button>
          <button type="button" id="exportPDF" class="btn-danger-modern btn-modern">
            <i class="fas fa-file-pdf"></i> Export PDF
          </button>
        </div>
      </div>
      <div class="table-container" style="max-height: 65vh; overflow: auto;">
        <table class="table table-striped" id="scorecardTable">
          <thead>
            <tr>
              <th>Key Focus Area</th>
              <th>Strategic Objective</th>
              <th>Performance Measure</th>
              <th>Unit Of Measure</th>
              <th>Target</th>
              <th>Weight</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody class="w3-small">
            {% for scorecard in scorecards %}
            <tr class="w3-border" data-id="{{ scorecard.id }}">
              <td data-label="Key Focus Area">
                <select name="keyFocusArea" class="key-focus-area">
                  <option value="Strategy" {% if scorecard.key_focus_area=='Strategy' %}selected{% endif %}>Strategy
                  </option>
                  <option value="Customer" {% if scorecard.key_focus_area=='Customer' %}selected{% endif %}>Customer
                  </option>
                  <option value="Innovation" {% if scorecard.key_focus_area=='Innovation' %}selected{% endif %}>
                    Innovation</option>
                  <option value="Operations" {% if scorecard.key_focus_area=='Operations' %}selected{% endif %}>
                    Operations</option>
                  <option value="Functional" {% if scorecard.key_focus_area=='Functional' %}selected{% endif %}>
                    Functional</option>
                </select>
              </td>
              <td data-label="Strategic Objective"><input type="text" name="strategicObjective"
                  class="strategic-objective" value="{{ scorecard.strategic_objective }}"></td>
              <td data-label="Performance Measure"><input type="text" name="performanceMeasure"
                  class="performance-measure" value="{{ scorecard.performance_measure }}"></td>
              <td data-label="Unit Of Measure">
                <select name="unitOfMeasure" class="unit-of-measure">
                  <option value="Yes / No" {% if scorecard.unit_of_measure=='Yes / No' %}selected{% endif %}>Yes / No
                  </option>
                  <option value="Percentage" {% if scorecard.unit_of_measure=='Percentage' %}selected{% endif %}>
                    Percentage</option>
                  <option value="Numeric" {% if scorecard.unit_of_measure=='Numeric' %}selected{% endif %}>Numeric
                  </option>
                </select>
              </td>
              <td data-label="Target"><input type="text" name="target" class="target" value="{{ scorecard.target }}">
              </td>
              <td data-label="Weight"><input type="text" name="weight" class="weight" value="{{ scorecard.weight }}">
              </td>
              <td data-label="Action">
                <div class="w3-flex" style="display: flex; gap: 8px;">
                  <button type="button" class="save-row btn-chip" title="Save Row"><i class="fas fa-save"></i>
                    Save</button>
                  <button type="button" class="delete-row btn-chip text-danger" title="Delete Row"><i
                      class="fas fa-trash"></i></button>
                </div>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
      <p id="errorMsg" class="error"></p>
    </div>
  </div>
</div>

<script>
  function calculateTotalWeight() {
    let total = 0;
    document.querySelectorAll('.weight').forEach(input => {
      const val = parseFloat(input.value) || 0;
      total += val;
    });
    const el = document.getElementById('totalWeight');
    const warning = document.getElementById('weightWarning');
    if (el) {
      el.textContent = `Total Weight: ${total}`;
      el.className = 'badge ' + (Math.abs(total - 100) < 0.01 ? 'bg-success' : 'bg-warning text-dark');
    }
    if (warning) {
      warning.style.display = Math.abs(total - 100) < 0.01 ? 'none' : 'inline';
    }
  }

  document.addEventListener('input', function (event) {
    if (event.target.classList.contains('weight')) {
      calculateTotalWeight();
    }
  });

  window.addEventListener('DOMContentLoaded', function () {
    calculateTotalWeight();

    // Export to Excel
    const exportExcelBtn = document.getElementById('exportExcel');
    if (exportExcelBtn) {
      exportExcelBtn.addEventListener('click', function () {
        const table = document.getElementById('scorecardTable');
        const wb = XLSX.utils.book_new();

        // Get table data
        const data = [];
        const headers = [];

        // Get headers
        table.querySelectorAll('thead th').forEach(th => {
          if (th.textContent.trim() !== 'Action') {
            headers.push(th.textContent.trim());
          }
        });
        data.push(headers);

        // Get rows data (excluding Action column)
        table.querySelectorAll('tbody tr').forEach(tr => {
          const row = [];
          tr.querySelectorAll('td').forEach((td, index) => {
            if (index < 6) { // Exclude Action column (index 6)
              const input = td.querySelector('input, select');
              if (input) {
                row.push(input.value || '');
              } else {
                row.push(td.textContent.trim());
              }
            }
          });
          data.push(row);
        });

        const ws = XLSX.utils.aoa_to_sheet(data);
        XLSX.utils.book_append_sheet(wb, ws, 'Scorecard');

        // Generate filename with current date
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const filename = `Scorecard_${dateStr}.xlsx`;

        XLSX.writeFile(wb, filename);
      });
    }

    // Export to PDF
    const exportPDFBtn = document.getElementById('exportPDF');
    if (exportPDFBtn) {
      exportPDFBtn.addEventListener('click', function () {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        // Get table data
        const headers = [];
        const rows = [];

        // Get headers (excluding Action)
        document.querySelectorAll('#scorecardTable thead th').forEach(th => {
          if (th.textContent.trim() !== 'Action') {
            headers.push(th.textContent.trim());
          }
        });

        // Get rows data (excluding Action column)
        document.querySelectorAll('#scorecardTable tbody tr').forEach(tr => {
          const row = [];
          tr.querySelectorAll('td').forEach((td, index) => {
            if (index < 6) { // Exclude Action column
              const input = td.querySelector('input, select');
              if (input) {
                row.push(input.value || '');
              } else {
                row.push(td.textContent.trim());
              }
            }
          });
          rows.push(row);
        });

        // Add title
        doc.setFontSize(18);
        doc.text('Scorecard Report', 14, 20);

        // Add date
        const now = new Date();
        const dateStr = now.toLocaleDateString('en-US', {
          year: 'numeric',
          month: 'long',
          day: 'numeric'
        });
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text(`Generated on: ${dateStr}`, 14, 28);

        // Add total weight
        const totalWeight = document.getElementById('totalWeight').textContent;
        doc.text(totalWeight, 14, 35);

        // Add table
        doc.autoTable({
          head: [headers],
          body: rows,
          startY: 42,
          styles: {
            fontSize: 8,
            cellPadding: 3,
          },
          headStyles: {
            fillColor: [99, 102, 241],
            textColor: 255,
            fontStyle: 'bold',
          },
          alternateRowStyles: {
            fillColor: [245, 247, 250],
          },
          margin: { top: 42, left: 14, right: 14 },
        });

        // Generate filename with current date
        const dateStrFile = now.toISOString().split('T')[0];
        const filename = `Scorecard_${dateStrFile}.pdf`;

        doc.save(filename);
      });
    }
  });
</script>

<script>
  $(document).ready(function () {
    // Add new row
    $('#addRow').click(function () {
      let newRow = `<tr data-id="new">
          <td data-label="Key Focus Area">
            <select name="keyFocusArea" class="key-focus-area">
              <option value="Strategy">Strategy</option>
              <option value="Customer">Customer</option>
              <option value="Innovation">Innovation</option>
              <option value="Operations">Operations</option>
              <option value="Functional">Functional</option>
            </select>
          </td>
          <td data-label="Strategic Objective"><input type="text" name="strategicObjective" class="strategic-objective"></td>
          <td data-label="Performance Measure"><input type="text" name="performanceMeasure" class="performance-measure"></td>
          <td data-label="Unit Of Measure">
            <select name="unitOfMeasure" class="unit-of-measure">
              <option value="Yes / No">Yes / No</option>
              <option value="Percentage">Percentage</option>
              <option value="Numeric">Numeric</option>
            </select>
          </td>
          <td data-label="Target"><input type="text" name="target" class="target"></td>
          <td data-label="Weight"><input type="text" name="weight" class="weight"></td>
          <td data-label="Action">
            <div class="w3-flex" style="display: flex; gap: 8px;">
              <button type="button" class="save-row btn-chip" title="Save Row"><i class="fas fa-save"></i> Save</button>
              <button type="button" class="delete-row btn-chip text-danger" title="Delete Row"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>`;
      $('#scorecardTable tbody').append(newRow);
    });

    // Save row to database
    $(document).on('click', '.save-row', function () {
      let row = $(this).closest('tr');
      let data = {
        id: row.data('id') === 'new' ? null : row.data('id'),
        keyFocusArea: row.find('.key-focus-area').val(),
        strategicObjective: row.find('.strategic-objective').val(),
        performanceMeasure: row.find('.performance-measure').val(),
        unitOfMeasure: row.find('.unit-of-measure').val(),
        target: row.find('.target').val(),
        weight: row.find('.weight').val()
      };

      $.ajax({
        url: "{{ url_for('save_scorecard_row') }}",
        method: "POST",
        contentType: "application/json",
        data: JSON.stringify(data),
        success: function (response) {
          alert(response.message);
          if (response.new_id) {
            row.attr('data-id', response.new_id);
            row.data('id', response.new_id);
          }
          calculateTotalWeight();
        },
        error: function (xhr) {
          alert('Error saving row: ' + (xhr.responseJSON?.error || 'Unknown error'));
        }
      });
    });

    // Delete row
    $(document).on('click', '.delete-row', function () {
      let row = $(this).closest('tr');
      let id = row.data('id');

      if (id === 'new') {
        row.remove();
        calculateTotalWeight();
        return;
      }

      if (confirm('Are you sure you want to delete this scorecard row?')) {
        $.ajax({
          url: "{{ url_for('delete_scorecard_row', id=0) }}".replace('/0', '/' + id),
          method: "POST",
          success: function (response) {
            alert(response.message);
            row.remove();
            calculateTotalWeight();
          },
          error: function (xhr) {
            alert('Error deleting row: ' + (xhr.responseJSON?.error || 'Unknown error'));
          }
        });
      }
    });
  });
</script>

{% endblock %}
