<div class="modal fade" id="mnExportModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content" style="border-radius: 16px;">
      <div class="modal-header">
        <h5 class="modal-title">Export PDF options</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p class="text-muted small mb-3">Professional report with a summary cover page, action-item table, and optional detail appendix.</p>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="mn-pdf-include-summary" checked />
          <label class="form-check-label" for="mn-pdf-include-summary">Include meeting summary</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="mn-pdf-group-platform" checked />
          <label class="form-check-label" for="mn-pdf-group-platform">Group by platform</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="mn-pdf-include-done" checked />
          <label class="form-check-label" for="mn-pdf-include-done">Include completed items</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="mn-pdf-include-labels-priority" checked />
          <label class="form-check-label" for="mn-pdf-include-labels-priority">Include priority &amp; labels</label>
        </div>
        <div class="form-check mb-2">
          <input class="form-check-input" type="checkbox" id="mn-pdf-include-subtasks" checked />
          <label class="form-check-label" for="mn-pdf-include-subtasks">Include sub-tasks</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="mn-pdf-include-discussion" />
          <label class="form-check-label" for="mn-pdf-include-discussion">Include discussion threads</label>
        </div>
        <hr />
        <label class="mn-filter-label" for="mn-pdf-email-recipients">Email recipients</label>
        <input
          type="text"
          class="form-control form-control-sm mb-2"
          id="mn-pdf-email-recipients"
          placeholder="name@example.com, second@example.com"
        />
        <input
          type="text"
          class="form-control form-control-sm"
          id="mn-pdf-email-subject"
          placeholder="Email subject (optional)"
        />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-sm mn-btn-ghost" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-sm mn-btn-ghost" id="mn-btn-email-export">Email report</button>
        <button type="button" class="btn btn-sm mn-btn-primary" id="mn-btn-confirm-export">Export</button>
      </div>
    </div>
  </div>
</div>
