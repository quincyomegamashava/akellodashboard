<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Word to HTML Converter</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">

  <div class="container text-center">
    <h2 class="mb-4">Convert Word Document to HTML</h2>
    
    <form id="uploadForm">
      <input type="file" id="fileInput" name="file" accept=".docx" class="form-control mb-3" required>
      <button type="submit" class="btn btn-primary">Upload & Convert</button>
    </form>

    <div id="downloadSection" class="mt-4 d-none">
      <a id="downloadLink" class="btn btn-success" download>Download Converted HTML</a>
    </div>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const fileInput = document.getElementById("fileInput");
      if (!fileInput.files.length) return;

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      // Send to backend
      const response = await fetch("http://127.0.0.1:5000/convert", {
        method: "POST",
        body: formData
      });

      if (response.ok) {
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        const downloadLink = document.getElementById("downloadLink");
        downloadLink.href = url;
        downloadLink.download = fileInput.files[0].name.replace(".docx", ".html");

        document.getElementById("downloadSection").classList.remove("d-none");
      } else {
        alert("Error converting file!");
      }
    });
  </script>
</body>
</html>
