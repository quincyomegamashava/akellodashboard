<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Play Game</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script src="{{ url_for('static', filename='js/quiz_math.js') }}"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      color: #0f172a;
    }

    .header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      padding: 14px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .header h2 {
      font-size: 17px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #0f172a;
      min-width: 0;
    }

    .header h2 span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .header h2 i { color: #0f172a; }

    .theme-chip {
      display: none;
      font-size: 11px;
      font-weight: 600;
      color: #475569;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      padding: 4px 10px;
      border-radius: 999px;
    }
    @media (min-width: 768px) {
      .theme-chip { display: inline-flex; align-items: center; gap: 6px; }
    }

    .back-btn {
      background: #fff;
      border: 1px solid #e2e8f0;
      color: #475569;
      padding: 9px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      font-family: inherit;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      white-space: nowrap;
    }

    .back-btn:hover {
      border-color: #0f172a;
      color: #0f172a;
      background: #f8fafc;
    }

    .game-container {
      max-width: 1400px;
      margin: 28px auto;
      padding: 0 24px;
    }

    #gameContainer {
      background: #fff;
      border-radius: 16px;
      padding: 28px;
      border: 1px solid rgba(15, 23, 42, 0.06);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.05);
      min-height: 500px;
    }

    .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: #94a3b8;
    }

    .loading-state i {
      font-size: 40px;
      margin-bottom: 16px;
      color: #64748b;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #scoreSubmissionStatus {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(6px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    #scoreSubmissionStatus.show { display: flex; }

    .status-modal {
      background: white;
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      animation: slideUp 0.35s ease-out;
      border: 1px solid #e2e8f0;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .status-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      font-size: 32px;
    }

    .status-icon.success { background: #f1f5f9; color: #0f172a; }
    .status-icon.error { background: #fee2e2; color: #e11d48; }
    .status-icon.loading { background: #f8fafc; color: #475569; }
    .status-icon.loading i { animation: spin 1s linear infinite; }

    #statusTitle {
      font-size: 22px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 10px;
    }

    #statusMessage {
      font-size: 15px;
      color: #64748b;
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .status-btn {
      background: #0f172a;
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.2s;
    }

    .status-btn:hover { background: #1e293b; }

    .sparkle {
      position: fixed;
      pointer-events: none;
      font-size: 14px;
      z-index: 1100;
      animation: sparkleOut 0.9s ease-out forwards;
    }
    @keyframes sparkleOut {
      0% { opacity: 1; transform: translate(0, 0) scale(1); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.4); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h2>
        <i class="fas fa-gamepad"></i>
        <span id="gameTitleHeader">Game</span>
      </h2>
      <span class="theme-chip">Powering Growth</span>
      <a href="/game-dashboard" class="back-btn">
        <i class="fas fa-arrow-left"></i> Dashboard
      </a>
    </div>
  </div>

  <div class="game-container">
    <div id="gameContainer">
      <div id="gameContent">
        <div class="loading-state">
          <i class="fas fa-spinner"></i>
          <p>Loading game…</p>
        </div>
      </div>
    </div>
  </div>

  <div id="scoreSubmissionStatus">
    <div class="status-modal">
      <div class="status-icon loading" id="statusIcon">
        <i class="fas fa-spinner"></i>
      </div>
      <h3 id="statusTitle">Submitting Score...</h3>
      <p id="statusMessage">Please wait...</p>
      <button class="status-btn" onclick="window.location.href='/game-dashboard'" id="statusBtn" style="display:none;">
        Return to Dashboard
      </button>
    </div>
  </div>

  <script>
    const gameId = window.location.pathname.split('/').pop();
    const gameUserId = sessionStorage.getItem('gameUserId');

    if (!gameUserId) {
      window.location.href = '/game-login';
    }

    function burstSparkles() {
      const icons = ['✦', '✧', '★'];
      for (let i = 0; i < 10; i++) {
        const el = document.createElement('span');
        el.className = 'sparkle';
        el.textContent = icons[i % icons.length];
        const dx = (Math.random() - 0.5) * 160;
        const dy = -40 - Math.random() * 100;
        el.style.setProperty('--dx', dx + 'px');
        el.style.setProperty('--dy', dy + 'px');
        el.style.left = (50 + (Math.random() - 0.5) * 20) + 'vw';
        el.style.top = '45vh';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 950);
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await loadGame();
      setupScoreSubmission();
    });

    async function loadGame() {
      try {
        const r = await fetch(`/api/games/${gameId}`);
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Failed to load game');

        document.getElementById('gameTitleHeader').textContent = data.game.title;
        const container = document.getElementById('gameContent');

        const parser = new DOMParser();
        const doc = parser.parseFromString(data.game.html_content, 'text/html');

        const styles = Array.from(doc.querySelectorAll('style'));
        const styleContents = styles.map(style => style.textContent);

        const scripts = Array.from(doc.querySelectorAll('script'));
        const scriptContents = scripts.map(script => ({
          src: script.src,
          text: script.textContent,
          type: script.type
        })).filter((s) => !/katex|quiz_math/i.test(s.src || ''));

        scripts.forEach(script => script.remove());
        styles.forEach(style => style.remove());

        styleContents.forEach(styleText => {
          const styleElement = document.createElement('style');
          styleElement.textContent = styleText;
          document.head.appendChild(styleElement);
        });
        const themeOverride = document.createElement('style');
        themeOverride.textContent = `
          body { background: #ffffff !important; color: #0f172a !important; }
          .choice.sel { border-color: #0f172a !important; background: #f8fafc !important; }
          .choice.ok { border-color: #334155 !important; background: #f1f5f9 !important; }
          .pip.on { background: #0f172a !important; }
          #nextBtn { background: #0f172a !important; color: #fff !important; }
          #checkBtn { background: #1e293b !important; color: #fff !important; }
        `;
        document.head.appendChild(themeOverride);

        container.innerHTML = doc.body.innerHTML;
        if (window.QuizMath) window.QuizMath.watch(container);

        scriptContents.forEach(scriptData => {
          const newScript = document.createElement('script');
          if (scriptData.type) newScript.type = scriptData.type;
          if (scriptData.src) {
            newScript.src = scriptData.src;
            newScript.onload = () => {
              setTimeout(() => injectScoreSubmissionScript(data.game), 100);
            };
          } else {
            newScript.textContent = scriptData.text;
          }
          container.appendChild(newScript);
        });

        if (scriptContents.every(s => !s.src)) {
          setTimeout(() => injectScoreSubmissionScript(data.game), 200);
        }
      } catch (e) {
        document.getElementById('gameContent').innerHTML =
          '<div style="text-align:center; padding:48px; color:#e11d48;"><i class="fas fa-exclamation-triangle" style="font-size:40px; margin-bottom:16px;"></i><p>Error loading game: ' + e.message + '</p></div>';
      }
    }

    function injectScoreSubmissionScript(game) {
      setTimeout(() => {
        window.gameScoreSubmit = function(score, maxScore) {
          if (window.submitGameScore) {
            window.submitGameScore(gameId, score, maxScore || game.max_score || null);
          }
        };

        const root = document.getElementById('gameContent');
        if (root && !root.dataset.scoreClickBound) {
          root.dataset.scoreClickBound = '1';
          root.addEventListener('click', function(e) {
            const btn = e.target.closest('#checkBtn');
            if (!btn || btn.disabled) return;
            setTimeout(() => {
              const scoreBox = document.getElementById('scoreBox');
              if (!scoreBox) return;
              const match = (scoreBox.textContent || '').match(/Score:\s*(\d+)\s*\/\s*(\d+)/i);
              if (match && window.gameScoreSubmit) {
                window.gameScoreSubmit(parseInt(match[1]), parseInt(match[2]));
              }
            }, 400);
          });
        }
      }, 500);
    }

    function setupScoreSubmission() {
      window.submitGameScore = async function(gameId, score, maxScore) {
        if (window._gameScoreSubmitting) return;
        window._gameScoreSubmitting = true;
        const statusDiv = document.getElementById('scoreSubmissionStatus');
        const statusTitle = document.getElementById('statusTitle');
        const statusMessage = document.getElementById('statusMessage');
        const statusIcon = document.getElementById('statusIcon');
        const statusBtn = document.getElementById('statusBtn');

        statusDiv.classList.add('show');
        statusIcon.className = 'status-icon loading';
        statusIcon.innerHTML = '<i class="fas fa-spinner"></i>';
        statusTitle.textContent = 'Submitting Score...';
        statusMessage.textContent = 'Please wait...';
        statusBtn.style.display = 'none';

        const userId = sessionStorage.getItem('gameUserId');
        if (!userId) {
          statusIcon.className = 'status-icon error';
          statusIcon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
          statusTitle.textContent = 'Error';
          statusMessage.textContent = 'User not authenticated. Please login again.';
          statusBtn.style.display = 'block';
          setTimeout(() => window.location.href = '/game-login', 3000);
          return;
        }

        try {
          const r = await fetch('/api/game-scores/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              game_id: parseInt(gameId),
              score: parseInt(score),
              max_score: maxScore ? parseInt(maxScore) : null,
              user_id: parseInt(userId)
            })
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || 'Failed to submit score');

          statusIcon.className = 'status-icon success';
          statusIcon.innerHTML = '<i class="fas fa-check"></i>';
          statusTitle.textContent = 'Score Submitted!';
          statusMessage.innerHTML = `
            <strong style="font-size: 22px; color: #0f172a;">${score}${maxScore ? ' / ' + maxScore : ''}</strong><br>
            ${data.score && data.score.percentage ? '<span style="color: #64748b;">Percentage: ' + data.score.percentage.toFixed(1) + '%</span>' : ''}<br><br>
            Great job — keep growing!
          `;
          statusBtn.style.display = 'block';
          burstSparkles();
        } catch (e) {
          window._gameScoreSubmitting = false;
          statusIcon.className = 'status-icon error';
          statusIcon.innerHTML = '<i class="fas fa-times"></i>';
          statusTitle.textContent = 'Error';
          statusMessage.textContent = 'Failed to submit score: ' + e.message;
          statusBtn.style.display = 'block';
        }
      };
    }
  </script>
</body>
</html>
