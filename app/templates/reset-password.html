<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password</title>
    <style>
        body { display: flex; min-height: 100vh; align-items: center; justify-content: center; background: #f5f7fb; }
        .card { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08); width: 100%; max-width: 420px; }
        .card h2 { margin-bottom: 16px; font-size: 20px; }
        .form-group { margin-bottom: 12px; }
        input[type="password"] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        button { width: 100%; padding: 12px; background: #3f2b96; color: #fff; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .errors { color: #c00; font-size: 12px; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Set a new password</h2>
        <form method="post">
            {{ form.hidden_tag() }}
            <div class="form-group">
                {{ form.password(placeholder='New password') }}
                {% for error in form.password.errors %}
                    <div class="errors">{{ error }}</div>
                {% endfor %}
            </div>
            <div class="form-group">
                {{ form.password2(placeholder='Repeat new password') }}
                {% for error in form.password2.errors %}
                    <div class="errors">{{ error }}</div>
                {% endfor %}
            </div>
            {{ form.submit() }}
        </form>
    </div>
</body>
</html>
