<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBC: Count Garden</title>
  <style>
    :root {
      --soil: #5d4037;
      --leaf: #66bb6a;
      --leaf-deep: #388e3c;
      --sun: #ffe082;
      --sky-top: #e8f5e9;
      --sky-bot: #c8e6c9;
      --cream: #fff8e7;
      --peach: #ffcc80;
      --coral: #ffab91;
      --sky-btn: #81d4fa;
      --ink: #2e4a28;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "Nunito", system-ui, sans-serif;
      background:
        radial-gradient(ellipse at 20% 10%, #fff9c4 0%, transparent 45%),
        radial-gradient(ellipse at 90% 20%, #b2dfdb 0%, transparent 40%),
        linear-gradient(180deg, var(--sky-top), var(--sky-bot) 55%, #a5d6a7);
      min-height: 100vh;
      color: var(--ink);
      padding-bottom: 24px;
    }
    .garden {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    header { text-align: center; margin-bottom: 14px; }
    h1 {
      font-size: clamp(1.4rem, 4vw, 1.85rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      color: var(--leaf-deep);
    }
    .subtitle {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-top: 4px;
    }
    #scoreBox {
      font-size: 1.2rem;
      font-weight: 800;
      background: #fff;
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      margin-top: 10px;
      box-shadow: 0 4px 0 rgba(56, 142, 60, 0.2);
    }
    .progress {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin: 12px 0 4px;
      flex-wrap: wrap;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--leaf);
      opacity: 0.45;
    }
    .dot.done { background: var(--leaf); opacity: 1; }
    .dot.now { opacity: 1; box-shadow: 0 0 0 3px rgba(255, 224, 130, 0.9); }
    .stage {
      background: var(--cream);
      border-radius: 28px;
      padding: 20px 16px 24px;
      min-height: 300px;
      box-shadow: 0 10px 28px rgba(46, 74, 40, 0.12);
      border: 3px solid #fff;
      position: relative;
      overflow: hidden;
    }
    .stage::before {
      content: "";
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 28px;
      background: linear-gradient(180deg, transparent, rgba(141, 110, 99, 0.18));
      pointer-events: none;
    }
    .prompt-art {
      font-size: 2.6rem;
      text-align: center;
      margin-bottom: 8px;
      line-height: 1.2;
    }
    .round-label {
      text-align: center;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 12px;
      color: var(--soil);
    }
    .items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      min-height: 100px;
      padding: 8px 0 4px;
    }
    .item {
      width: 72px;
      height: 72px;
      min-width: 56px;
      min-height: 56px;
      font-size: 2.5rem;
      border: none;
      background: #fff;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 5px 0 #c9a227;
      transition: transform 0.15s, opacity 0.2s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .item:active { transform: scale(0.94); }
    .item.tapped {
      opacity: 0.35;
      transform: scale(0.9);
      box-shadow: 0 2px 0 #c9a227;
    }
    .count-bubble {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--leaf-deep);
      min-height: 1.6em;
      margin: 8px 0 4px;
    }
    .choices {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .num-btn {
      min-width: 88px;
      min-height: 88px;
      font-size: 2.2rem;
      font-weight: 800;
      border: none;
      border-radius: 22px;
      background: var(--sun);
      color: var(--soil);
      cursor: pointer;
      box-shadow: 0 6px 0 #d4a017;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .num-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #d4a017;
    }
    .num-btn.correct-flash {
      background: #a5d6a7;
      box-shadow: 0 6px 0 var(--leaf-deep);
      animation: pop 0.45s ease;
    }
    .num-btn.gentle-wrong {
      animation: wiggle 0.4s ease;
      background: var(--coral);
    }
    @keyframes pop {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.14); }
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-6deg); }
      75% { transform: rotate(6deg); }
    }
    .feedback {
      text-align: center;
      min-height: 56px;
      font-size: 1.1rem;
      margin-top: 14px;
      font-weight: 700;
      line-height: 1.35;
      padding: 0 8px;
    }
    .feedback.ok { color: var(--leaf-deep); }
    .feedback.hint { color: #bf360c; }
    .celebrate-burst {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      opacity: 0;
      animation: burst 0.9s ease forwards;
    }
    @keyframes burst {
      0% { opacity: 0; transform: scale(0.4); }
      40% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0; transform: scale(1.6) translateY(-20px); }
    }
    .actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    #checkBtn, #speakBtn, #nextBtn {
      min-height: 56px;
      min-width: 56px;
      padding: 12px 22px;
      font-size: 1.05rem;
      font-weight: 700;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      touch-action: manipulation;
    }
    #checkBtn {
      background: var(--leaf-deep);
      color: #fff;
      box-shadow: 0 4px 0 #1b5e20;
    }
    #checkBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    #speakBtn {
      background: var(--sky-btn);
      color: #01579b;
      box-shadow: 0 4px 0 #0288d1;
    }
    #nextBtn {
      background: var(--peach);
      color: var(--soil);
      box-shadow: 0 4px 0 #ef6c00;
    }
    #nextBtn:disabled, #nextBtn.hidden { display: none; }
    .hidden { display: none !important; }
    .done-panel {
      text-align: center;
      padding: 24px 12px;
    }
    .done-panel h2 { font-size: 1.5rem; margin-bottom: 8px; color: var(--leaf-deep); }
  </style>
</head>
<body>
  <div class="garden">
    <header>
      <h1>Count Garden</h1>
      <p class="subtitle">Tap each thing, then pick how many!</p>
      <div id="scoreBox">Score: 0 / 10</div>
      <div class="progress" id="progress" aria-hidden="true"></div>
    </header>
    <div class="stage" id="stage">
      <div class="prompt-art" id="promptArt" aria-hidden="true">🌻</div>
      <p class="round-label" id="roundLabel">Round 1 of 10</p>
      <div class="items" id="items" role="group" aria-label="Things to count"></div>
      <div class="count-bubble" id="countBubble" aria-live="polite"></div>
      <div class="choices" id="choices" role="group" aria-label="Number choices"></div>
      <p class="feedback" id="feedback" aria-live="polite"></p>
    </div>
    <div class="actions">
      <button type="button" id="speakBtn">Hear again</button>
      <button type="button" id="nextBtn" class="hidden" disabled>Next</button>
      <button type="button" id="checkBtn" disabled>Finish garden</button>
    </div>
  </div>
  <script>
    const CONTENT = {
      learningArea: "Mathematics",
      topic: "Counting and grouping (Zimbabwean garden themes)",
      ageRange: "Infants",
      totalRounds: 10,
      maxScore: 10,
      questionPool: [
        {
          id: "mangoes",
          emoji: "🥭",
          label: "mangoes",
          theme: "Mango tree in Mutare",
          speakCount: "Count the mangoes. Tap each one.",
          speakAsk: "How many mangoes?",
          countMin: 2,
          countMax: 5,
          reason: "Each mango you tap adds one. The number that matches your taps is correct."
        },
        {
          id: "maize",
          emoji: "🌽",
          label: "maize cobs",
          theme: "Maize field near Gweru",
          speakCount: "Count the maize cobs. Tap each one.",
          speakAsk: "How many maize cobs?",
          countMin: 2,
          countMax: 6,
          reason: "One tap for each cob. Match the total taps with the number button."
        },
        {
          id: "sunflowers",
          emoji: "🌻",
          label: "sunflowers",
          theme: "Sunny garden in Harare",
          speakCount: "Count the sunflowers. Tap each one.",
          speakAsk: "How many sunflowers?",
          countMin: 3,
          countMax: 6,
          reason: "Sunflowers stand tall — tap each bloom once, then choose that number."
        },
        {
          id: "tomatoes",
          emoji: "🍅",
          label: "tomatoes",
          theme: "Tomato patch in Bindura",
          speakCount: "Count the tomatoes. Tap each one.",
          speakAsk: "How many tomatoes?",
          countMin: 2,
          countMax: 5,
          reason: "Red tomatoes — one tap each. The right number equals how many you tapped."
        },
        {
          id: "pumpkins",
          emoji: "🎃",
          label: "pumpkins",
          theme: "Pumpkins in a Mashonaland garden",
          speakCount: "Count the pumpkins. Tap each one.",
          speakAsk: "How many pumpkins?",
          countMin: 2,
          countMax: 4,
          reason: "Big pumpkins are easy to see. Tap every pumpkin, then pick the matching number."
        },
        {
          id: "bananas",
          emoji: "🍌",
          label: "bananas",
          theme: "Banana plants in Chipinge",
          speakCount: "Count the bananas. Tap each one.",
          speakAsk: "How many bananas?",
          countMin: 3,
          countMax: 6,
          reason: "Yellow bananas — tap one by one. Your taps tell you the answer."
        },
        {
          id: "oranges",
          emoji: "🍊",
          label: "oranges",
          theme: "Orange trees in Mazowe",
          speakCount: "Count the oranges. Tap each one.",
          speakAsk: "How many oranges?",
          countMin: 2,
          countMax: 5,
          reason: "Round oranges — count by tapping. Choose the number that matches."
        },
        {
          id: "beans",
          emoji: "🫘",
          label: "bean pods",
          theme: "Bean rows in a village garden",
          speakCount: "Count the bean pods. Tap each one.",
          speakAsk: "How many bean pods?",
          countMin: 3,
          countMax: 6,
          reason: "Small bean pods — tap carefully so you do not miss one."
        },
        {
          id: "flowers",
          emoji: "🌺",
          label: "garden flowers",
          theme: "Flower bed at school",
          speakCount: "Count the flowers. Tap each one.",
          speakAsk: "How many flowers?",
          countMin: 2,
          countMax: 5,
          reason: "Pretty flowers — one tap for each bloom equals the right number."
        },
        {
          id: "avocados",
          emoji: "🥑",
          label: "avocados",
          theme: "Avocado tree in Bulawayo",
          speakCount: "Count the avocados. Tap each one.",
          speakAsk: "How many avocados?",
          countMin: 2,
          countMax: 4,
          reason: "Green avocados — tap each fruit, then choose that total."
        },
        {
          id: "carrots",
          emoji: "🥕",
          label: "carrots",
          theme: "Carrot rows after rain",
          speakCount: "Count the carrots. Tap each one.",
          speakAsk: "How many carrots?",
          countMin: 3,
          countMax: 6,
          reason: "Orange carrots from the soil — tap every one before you choose."
        },
        {
          id: "watermelons",
          emoji: "🍉",
          label: "watermelons",
          theme: "Watermelons for market day",
          speakCount: "Count the watermelons. Tap each one.",
          speakAsk: "How many watermelons?",
          countMin: 2,
          countMax: 4,
          reason: "Big striped melons — few to count. Tap each, then pick the number."
        }
      ],
      hints: {
        tooLow: "Almost! Try a bigger number. Keep tapping each thing.",
        tooHigh: "That number is a bit big. Count the taps again.",
        missedTaps: "Tap every picture first, then choose the number.",
        celebrate: "Yes! Great counting!",
        gentle: "Try again — you can do it!"
      }
    };

    function initializeGameSession(pool) {
      let shuffledPool = [...pool];
      for (let i = shuffledPool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledPool[i], shuffledPool[j]] = [shuffledPool[j], shuffledPool[i]];
      }
      return shuffledPool.slice(0, CONTENT.totalRounds);
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 0.9;
      u.pitch = 1.05;
      u.lang = "en-GB";
      window.speechSynthesis.speak(u);
    }

    let sessionItems = [];
    let roundIndex = 0;
    let score = 0;
    let tapped = 0;
    let targetCount = 0;
    let current = null;
    let roundAwarded = false;
    let roundSolved = false;
    let gameComplete = false;

    const scoreBox = document.getElementById("scoreBox");
    const progressEl = document.getElementById("progress");
    const promptArt = document.getElementById("promptArt");
    const roundLabel = document.getElementById("roundLabel");
    const itemsEl = document.getElementById("items");
    const countBubble = document.getElementById("countBubble");
    const choicesEl = document.getElementById("choices");
    const feedbackEl = document.getElementById("feedback");
    const stageEl = document.getElementById("stage");
    const speakBtn = document.getElementById("speakBtn");
    const nextBtn = document.getElementById("nextBtn");
    const checkBtn = document.getElementById("checkBtn");

    function updateScore() {
      scoreBox.textContent = "Score: " + score + " / " + CONTENT.maxScore;
    }

    function renderProgress() {
      progressEl.innerHTML = "";
      for (let i = 0; i < CONTENT.totalRounds; i++) {
        const d = document.createElement("span");
        d.className = "dot";
        if (i < roundIndex) d.classList.add("done");
        if (i === roundIndex && !gameComplete) d.classList.add("now");
        if (gameComplete) d.classList.add("done");
        progressEl.appendChild(d);
      }
    }

    function buildChoices(correct) {
      const opts = new Set([correct]);
      while (opts.size < 3) {
        const delta = randInt(-2, 2);
        const n = correct + delta;
        if (n >= 1 && n <= 8 && n !== correct) opts.add(n);
      }
      const arr = Array.from(opts);
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function materializeRound(template) {
      const count = randInt(template.countMin, template.countMax);
      return {
        template: template,
        count: count,
        choices: buildChoices(count)
      };
    }

    function loadRound() {
      roundAwarded = false;
      roundSolved = false;
      tapped = 0;
      current = materializeRound(sessionItems[roundIndex]);
      targetCount = current.count;
      const t = current.template;

      promptArt.textContent = t.emoji + " " + t.emoji;
      roundLabel.textContent = "Round " + (roundIndex + 1) + " of " + CONTENT.totalRounds;
      countBubble.textContent = "Taps: 0";
      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      nextBtn.classList.add("hidden");
      nextBtn.disabled = true;
      choicesEl.innerHTML = "";
      itemsEl.innerHTML = "";

      for (let i = 0; i < targetCount; i++) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "item";
        btn.textContent = t.emoji;
        btn.setAttribute("aria-label", t.label + " " + (i + 1));
        btn.addEventListener("click", function () {
          if (roundSolved || btn.classList.contains("tapped")) return;
          btn.classList.add("tapped");
          tapped += 1;
          countBubble.textContent = "Taps: " + tapped;
          if (window.navigator.vibrate) window.navigator.vibrate(12);
        });
        itemsEl.appendChild(btn);
      }

      current.choices.forEach(function (n) {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "num-btn";
        b.textContent = String(n);
        b.setAttribute("aria-label", "Number " + n);
        b.addEventListener("click", function () {
          onNumberPick(n, b);
        });
        choicesEl.appendChild(b);
      });

      renderProgress();
      speak(t.speakCount + " " + t.speakAsk);
    }

    function showBurst() {
      const burst = document.createElement("div");
      burst.className = "celebrate-burst";
      burst.textContent = "⭐";
      stageEl.appendChild(burst);
      setTimeout(function () { burst.remove(); }, 900);
    }

    function onNumberPick(n, btn) {
      if (roundSolved) return;
      const t = current.template;

      if (tapped < targetCount) {
        feedbackEl.className = "feedback hint";
        feedbackEl.textContent = CONTENT.hints.missedTaps;
        speak(CONTENT.hints.missedTaps);
        btn.classList.add("gentle-wrong");
        setTimeout(function () { btn.classList.remove("gentle-wrong"); }, 400);
        return;
      }

      if (n === targetCount) {
        roundSolved = true;
        if (!roundAwarded) {
          score += 1;
          roundAwarded = true;
          updateScore();
        }
        btn.classList.add("correct-flash");
        feedbackEl.className = "feedback ok";
        feedbackEl.textContent =
          CONTENT.hints.celebrate + " There are " + targetCount + " " + t.label + ". " + t.reason;
        speak(CONTENT.hints.celebrate + " " + targetCount + " " + t.label + ".");
        showBurst();

        if (roundIndex >= CONTENT.totalRounds - 1) {
          gameComplete = true;
          checkBtn.disabled = false;
          nextBtn.classList.add("hidden");
          renderProgress();
          setTimeout(function () {
            feedbackEl.textContent += " Garden complete — tap Finish garden!";
          }, 600);
        } else {
          nextBtn.classList.remove("hidden");
          nextBtn.disabled = false;
        }
      } else {
        // Zero score penalties — gentle retry
        feedbackEl.className = "feedback hint";
        let tip = CONTENT.hints.gentle + " ";
        if (n < targetCount) tip += CONTENT.hints.tooLow;
        else tip += CONTENT.hints.tooHigh;
        tip += " Correct is " + targetCount + " " + t.label + ". " + t.reason;
        feedbackEl.textContent = tip;
        speak(CONTENT.hints.gentle + " Try again.");
        btn.classList.add("gentle-wrong");
        setTimeout(function () { btn.classList.remove("gentle-wrong"); }, 400);
      }
    }

    function goNext() {
      if (!roundSolved || roundIndex >= CONTENT.totalRounds - 1) return;
      roundIndex += 1;
      loadRound();
    }

    function submitFinal() {
      if (!gameComplete) return;
      const finalScore = score;
      const maxScore = CONTENT.maxScore;
      feedbackEl.className = "feedback ok";
      feedbackEl.textContent = "Wonderful! Score: " + finalScore + " / " + maxScore;
      speak("Wonderful! Your score is " + finalScore + " out of " + maxScore);
      if (window.gameScoreSubmit) {
        window.gameScoreSubmit(finalScore, maxScore);
      } else if (window.parent && window.parent.submitGameScore) {
        const gameIdMatch = window.location.pathname.match(/\/play-game\/(\d+)/);
        if (gameIdMatch) window.parent.submitGameScore(parseInt(gameIdMatch[1]), finalScore, maxScore);
      }
    }

    speakBtn.addEventListener("click", function () {
      if (!current) return;
      const t = current.template;
      if (roundSolved) {
        speak(CONTENT.hints.celebrate + " " + targetCount + " " + t.label + ".");
      } else {
        speak(t.speakCount + " " + t.speakAsk);
      }
    });
    nextBtn.addEventListener("click", goNext);
    checkBtn.addEventListener("click", submitFinal);

    function startGame() {
      sessionItems = initializeGameSession(CONTENT.questionPool);
      roundIndex = 0;
      score = 0;
      gameComplete = false;
      checkBtn.disabled = true;
      updateScore();
      loadRound();
    }

    startGame();
  </script>
</body>
</html>
